name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore .\WalkaAmazonIntelligence.sln

      - name: Build Release
        run: dotnet build .\WalkaAmazonIntelligence.sln --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test Release
        run: dotnet test .\WalkaAmazonIntelligence.sln --configuration Release --no-build --no-restore --logger "trx;LogFileName=test-results.trx"

      - name: WPF shell smoke
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP ("walka-smoke-" + [guid]::NewGuid().ToString("N"))
          $env:WALKA_Storage__Root = $root
          $exe = Resolve-Path ".\src\WalkaAmazonIntelligence.Desktop\bin\Release\net10.0-windows\WalkaAmazonIntelligence.Desktop.exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--smoke-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "WPF smoke test exited with code $($process.ExitCode)." }
          $marker = Join-Path $root "Logs\smoke.ok"
          if (-not (Test-Path $marker)) { throw "WPF smoke marker was not created." }
          Get-Content $marker
